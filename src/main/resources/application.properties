# ========================================
# Prognoza Meteo — Configuratie aplicatie
# ========================================

# Baza de date PostgreSQL
db.url=jdbc:postgresql://localhost:5433/prognoza_meteo
db.user=postgres
db.password=postgres

# Pool de conexiuni HikariCP
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=5000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000

# API Open-Meteo
api.retry.max=3
api.retry.delayMs=2000
api.timeoutSeconds=30

# Prognoza si istoric
forecast.days=10
historical.years=2

# UI
ui.theme=dark
