services:
  postgres:
    image: postgres:16-alpine
    container_name: prognoza-meteo-db
    environment:
      POSTGRES_DB: prognoza_meteo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prognoza_meteo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: prognoza-meteo-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/prognoza_meteo
      DB_USER: postgres
      DB_PASSWORD: postgres
      DISPLAY: ${DISPLAY:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix

volumes:
  pgdata:
